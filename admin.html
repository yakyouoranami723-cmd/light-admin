<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>ライト管理者ダッシュボード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans h-screen flex">

    <!-- サイドバー -->
    <aside class="w-64 bg-gray-900 text-white flex flex-col">
        <div class="p-6">
            <h1 class="text-2xl font-bold tracking-wider">Admin Panel</h1>
            <p class="text-gray-400 text-sm mt-1">Light AI System</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="block px-4 py-2 bg-gray-800 rounded hover:bg-gray-700 transition">📝 ルール設定・履歴</a>
            <a href="#logs" class="block px-4 py-2 hover:bg-gray-700 rounded transition">💬 会話ログ監視</a>
        </nav>
    </aside>

    <!-- メインコンテンツ -->
    <main class="flex-1 overflow-y-auto p-8">
        
        <!-- ダッシュボード統計 -->
        <div class="grid grid-cols-2 gap-6 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                <h3 class="text-gray-500 text-sm font-medium">総会話数</h3>
                <p id="total-chats" class="text-3xl font-bold text-gray-800 mt-2">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                <h3 class="text-gray-500 text-sm font-medium">システム状態</h3>
                <p class="text-xl font-bold text-green-600 mt-2 flex items-center gap-2">
                    <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span> 正常稼働中
                </p>
            </div>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">
            <!-- ルール編集エリア -->
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                <h2 class="text-xl font-bold text-gray-800 mb-4">🤖 ライトの全体ルール（プロンプト）</h2>
                <textarea id="prompt-input" rows="8" class="w-full border border-gray-300 rounded p-3 focus:outline-none focus:border-blue-500" placeholder="ここにAIのルールや性格を入力..."></textarea>
                <div class="flex justify-end gap-3 mt-4">
                    <input type="text" id="version-note" placeholder="変更のメモ (例: 文化祭仕様)" class="border border-gray-300 rounded px-3 py-2 text-sm flex-1">
                    <button id="save-prompt-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition">設定を更新</button>
                </div>
            </div>

            <!-- ルール履歴エリア -->
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                <h2 class="text-xl font-bold text-gray-800 mb-4">🕒 ルールの変更履歴</h2>
                <div class="h-64 overflow-y-auto border border-gray-200 rounded">
                    <ul id="history-list" class="divide-y divide-gray-200">
                        <!-- 履歴がここに入る -->
                    </ul>
                </div>
            </div>
        </div>

        <!-- 会話ログ監視エリア -->
        <div id="logs" class="mt-8 bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <h2 class="text-xl font-bold text-gray-800 mb-4">💬 リアルタイム会話ログ</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm border-b border-gray-300">
                            <th class="p-3">日時</th>
                            <th class="p-3">ユーザーの質問</th>
                            <th class="p-3">ライトの回答</th>
                        </tr>
                    </thead>
                    <tbody id="chat-logs-table" class="text-sm divide-y divide-gray-200">
                        <!-- ログがここに入る -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // --- 1. 設定情報 (index.htmlと同じものを入力) ---
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // --- 2. 初期化 ---
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- 3. ルールの読み込み・保存 ---
        const promptInput = document.getElementById('prompt-input');
        
        // 現在のルールを監視
        db.collection("settings").doc("systemPrompt").onSnapshot((doc) => {
            if (doc.exists) promptInput.value = doc.data().text;
        });

        // ルール更新＆履歴保存
        document.getElementById('save-prompt-btn').addEventListener('click', async () => {
            const newText = promptInput.value;
            const note = document.getElementById('version-note').value || "メモなし";
            
            // 現在のルールを更新
            await db.collection("settings").doc("systemPrompt").set({ text: newText });
            
            // 履歴に追加
            await db.collection("promptHistory").add({
                text: newText,
                note: note,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            document.getElementById('version-note').value = "";
            alert('ルールを更新し、履歴に保存しました！');
        });

        // --- 4. 履歴リストの表示 ---
        const historyList = document.getElementById('history-list');
        db.collection("promptHistory").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            historyList.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const date = data.timestamp ? data.timestamp.toDate().toLocaleString('ja-JP') : "保存中...";
                
                const li = document.createElement('li');
                li.className = "p-3 hover:bg-gray-50 flex justify-between items-center";
                li.innerHTML = `
                    <div>
                        <p class="font-bold text-sm text-gray-800">${data.note}</p>
                        <p class="text-xs text-gray-500">${date}</p>
                    </div>
                    <button onclick="restorePrompt('${doc.id}')" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1 rounded">復元</button>
                `;
                historyList.appendChild(li);
            });
        });

        // 復元機能
        window.restorePrompt = async (docId) => {
            if(!confirm("このバージョンに復元しますか？")) return;
            const docRef = await db.collection("promptHistory").doc(docId).get();
            const textToRestore = docRef.data().text;
            
            // ルールを復元
            await db.collection("settings").doc("systemPrompt").set({ text: textToRestore });
            // 「復元」という記録を履歴に追加
            await db.collection("promptHistory").add({
                text: textToRestore,
                note: `[復元] ${docRef.data().note}`,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        };

        // --- 5. 会話ログの表示とカウント ---
        const chatLogsTable = document.getElementById('chat-logs-table');
        const totalChatsDisplay = document.getElementById('total-chats');

        db.collection("chatLogs").orderBy("timestamp", "desc").limit(100).onSnapshot((snapshot) => {
            chatLogsTable.innerHTML = "";
            totalChatsDisplay.innerText = snapshot.size; // 簡易的に最近100件の数を表示（全件取得はコストがかかるため制限）

            snapshot.forEach((doc) => {
                const data = doc.data();
                const date = data.timestamp ? data.timestamp.toDate().toLocaleString('ja-JP', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}) : "-";
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 text-xs text-gray-500 whitespace-nowrap">${date}</td>
                    <td class="p-3 text-gray-800 max-w-xs truncate" title="${data.userText}">${data.hasImage ? '📷 ' : ''}${data.userText || '(画像のみ)'}</td>
                    <td class="p-3 text-gray-600 max-w-md truncate" title="${data.aiText}">${data.aiText}</td>
                `;
                chatLogsTable.appendChild(tr);
            });
        });
    </script>
</body>
</html>
